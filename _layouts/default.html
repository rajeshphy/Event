<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="{{ site.description | escape }}">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #0d1117;
      --surface: #161b22;
      --surface-raised: #1d242d;
      --text: #f0f6fc;
      --muted: #8b949e;
      --line: #30363d;
      --accent: #f5b642;
      --accent-soft: rgba(245, 182, 66, 0.14);
      --radius: 18px;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }
    html { background: var(--page); scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      color: var(--text);
      background:
        radial-gradient(circle at 18% -10%, rgba(245, 182, 66, 0.12), transparent 30rem),
        var(--page);
      -webkit-font-smoothing: antialiased;
    }

    .site-header, main, .site-footer__inner {
      width: min(100% - 2rem, 78rem);
      margin-inline: auto;
    }

    .site-header { padding: clamp(2.4rem, 7vw, 5.5rem) 0 1.8rem; }
    .eyebrow {
      margin: 0 0 0.65rem;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .site-title {
      max-width: 14ch;
      margin: 0;
      font-size: clamp(2.35rem, 8vw, 5.4rem);
      line-height: 0.98;
      letter-spacing: -0.055em;
    }
    .site-intro {
      max-width: 38rem;
      margin: 1.1rem 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.4vw, 1.15rem);
      line-height: 1.65;
    }

    main { flex: 1; padding-bottom: 4rem; }
    .site-footer { color: var(--muted); font-size: 0.82rem; }
    .site-footer__inner { padding: 1.5rem 0 2rem; border-top: 1px solid var(--line); }
    :focus-visible { outline: 3px solid rgba(245, 182, 66, 0.55); outline-offset: 3px; }

    @media (max-width: 640px) {
      .site-header, main, .site-footer__inner { width: min(100% - 1.2rem, 78rem); }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <p class="eyebrow">Photograph archive</p>
    <h1 class="site-title">{{ site.title }}</h1>
    <p class="site-intro">Open an event, choose an album.</p>
  </header>

  <main>{{ content }}</main>

  <footer class="site-footer">
    <div class="site-footer__inner">&copy; {{ site.time | date: '%Y' }} {{ site.title }}</div>
  </footer>
</body>
</html>
